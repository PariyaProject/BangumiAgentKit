name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  harness-control:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Harness V3 simulations
        run: pnpm harness:test

      - name: Reject legacy runtime-state changes in V3 Product PRs
        if: github.event_name == 'pull_request'
        env:
          HARNESS_BASE_REF: origin/${{ github.base_ref }}
          HARNESS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: pnpm harness:guard

  sqlite-default:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @bangumi-agent-kit/renderer exec playwright install --with-deps chromium

      - name: Setup local database & environment
        run: pnpm setup:local

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run environment doctor
        run: pnpm run doctor

      - name: Lint check
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run contract tests
        run: pnpm test:contract

      - name: Run semantic tests
        run: pnpm test:semantic

      - name: Run SQLite integration tests
        run: pnpm test:integration:sqlite

      - name: Run render tests
        run: pnpm test:render

      - name: Verify OpenAPI generated outputs
        run: pnpm openapi:verify

      - name: Build packages
        run: pnpm build

      - name: Run built SQLite runtime smoke
        run: pnpm smoke:runtime:sqlite

  host-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NoneBot image adapter dependencies
        run: python -m pip install "nonebot2>=2.4,<3" "nonebot-adapter-onebot>=2.4,<3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP and workspace packages
        run: pnpm build

      - name: Run Python host tests
        run: pnpm test:host

      - name: Run host smoke without real Claude
        run: pnpm smoke:host

      - name: Run built MCP host integration
        run: pnpm test:integration:host-built

  standalone-release-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Isolate HOME from runner configuration
        run: echo "HOME=$RUNNER_TEMP/bangumi-agent-kit-home" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NoneBot image adapter dependencies
        run: python -m pip install "nonebot2>=2.4,<3" "nonebot-adapter-onebot>=2.4,<3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup local database & environment
        run: pnpm setup:local

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Build workspace
        run: pnpm build

      - name: Run Standalone tests
        run: pnpm test:standalone

      - name: Run local self-test
        run: pnpm self-test

      - name: Run built SQLite runtime smoke
        run: pnpm smoke:runtime:sqlite

      - name: Run Standalone smoke
        run: pnpm smoke:standalone

      - name: Run Host fake-Claude smoke
        run: pnpm smoke:host

      - name: Run v0.1 release smoke
        run: pnpm smoke:v0.1

  postgres-compat:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bangumi
          POSTGRES_PASSWORD: bangumipassword
          POSTGRES_DB: bangumi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BANGUMI_DB_DRIVER: postgres
      DATABASE_URL: postgres://bangumi:bangumipassword@localhost:5432/bangumi_db
      BANGUMI_TOKEN_ENCRYPTION_KEY: test-secret-key-123456789012345678901234

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run environment doctor
        run: pnpm run doctor

      - name: Run unit tests (non-render)
        run: pnpm vitest run tests/unit --exclude tests/unit/renderer.test.ts

      - name: Run contract tests
        run: pnpm test:contract

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration:postgres

  provider-foundation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run provider foundation tests
        run: pnpm test:provider

  discovery-foundation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run provider foundation tests
        run: pnpm test:provider

      - name: Run discovery foundation tests
        run: pnpm test:discovery
