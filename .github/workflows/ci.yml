name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bangumi
          POSTGRES_PASSWORD: bangumipassword
          POSTGRES_DB: bangumi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://bangumi:bangumipassword@localhost:5432/bangumi_db
      BANGUMI_TOKEN_ENCRYPTION_KEY: test-secret-key-123456789012345678901234

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Lint check
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run contract tests
        run: pnpm test:contract

      - name: Run integration tests
        run: pnpm test:integration

      - name: Verify OpenAPI generated outputs
        run: pnpm openapi:verify

      - name: Build packages
        run: pnpm build
